<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;font-family:-apple-system,system-ui,"Segoe UI",Roboto,sans-serif;background:#0B1F44;color:#fff;display:flex;align-items:center;justify-content:center;padding:24px}
  .card{width:100%;max-width:420px;background:#12295A;border:1px solid #C9A646;border-radius:24px;padding:28px 24px;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.35)}
  img{width:120px;height:120px}
  h1{margin:12px 0 4px;font-size:26px;color:#E7C766;letter-spacing:2px}
  .sub{margin:0 0 24px;color:#C8CFDD;font-size:14px}
  label{display:block;text-align:left;font-size:14px;color:#C8CFDD;margin-bottom:6px}
  input{width:100%;font-size:28px;padding:14px 16px;border-radius:14px;border:2px solid #C0C6D0;background:#fff;color:#0B1F44;outline:none}
  input:focus{border-color:#E7C766}
  .res{margin-top:22px;padding:18px;border-radius:16px;background:#0B1F44}
  .big{font-size:38px;font-weight:700;color:#E7C766}
  .small{font-size:14px;color:#C8CFDD;margin-top:6px}
  .precio{margin-top:20px;font-size:13px;color:#AEB6C6;line-height:1.5}
  button{margin-top:10px;background:none;border:1px solid #C0C6D0;color:#fff;border-radius:10px;padding:6px 12px;font-size:13px;cursor:pointer}
  table{width:100%;margin-top:22px;border-collapse:collapse;font-size:15px}
  th{font-weight:600;color:#E7C766;padding:8px 6px;border-bottom:1px solid #C9A646;text-align:right}
  td{padding:9px 6px;border-bottom:1px solid #2A3F6E;text-align:right}
  th:first-child,td:first-child{text-align:left}
  .tt{margin-top:24px;text-align:left;font-size:16px;color:#E7C766;font-weight:600}
  body{padding-bottom:60px}
  .vers{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:14px}
  .vers button{margin:0;padding:6px 18px;border-radius:999px;font-weight:700;border:1px solid #C9A646;background:none;color:#E7C766}
  .vers button.on{background:#C9A646;color:#0B1F44}
  body.v2 .det{display:none}
</style>

  <h1>PAGA</h1>
  <p class="sub">1 PAGA = 0,10 USD<br><span id="regla">Con colateral del 250 %</span></p>
  <label for="doge">¿Cuántos DOGE vas a cambiar?</label>
  <input id="doge" type="number" inputmode="decimal" min="0" placeholder="Ej. 10000" value="10000">
  <div class="res">
    <div class="small">Recibes</div>
    <div class="big" id="paga">–</div>
    <div class="small det" id="valor"></div>
  </div>
  <div class="precio" id="precio">Cargando el precio del DOGE…</div>
  <button id="act" class="det">Actualizar precio</button>
  <div class="tt det">Tabla rápida al precio actual</div>
  <table class="det"><thead><tr><th>DOGE</th><th>Valor USD</th><th>Recibe</th></tr></thead><tbody id="tabla"></tbody></table>
</div>
<script>
// Regla del contrato de prueba: PAGA = DOGE × precio ÷ 0,10 ÷ 2,5 (colateral 250 %)
const PRECIO_PAGA = 0.10;
let COLATERAL = 2.5; // V1: colateral 250 %. V2: sin colateral (1)
let precio = 0;
const $ = id => document.getElementById(id);
const usd = v => v.toLocaleString('es-ES',{minimumFractionDigits:2,maximumFractionDigits:2});
function tabla(){
  const filas=[1000,5000,10000,50000,100000].map(d=>{
    const v=d*precio, p=Math.floor(v/PRECIO_PAGA/COLATERAL);
    return '<tr><td>'+d.toLocaleString('es-ES')+' DOGE</td><td>$'+usd(v)+'</td><td>'+p.toLocaleString('es-ES')+' PAGA</td></tr>';
  });
  $('tabla').innerHTML = precio ? filas.join('') : '';
}
function calcular(){
  tabla();
  const d = parseFloat(($('doge').value||'').replace(',','.')) || 0;
  if(!precio){ $('paga').textContent='–'; return; }
  const valor = d*precio;
  const paga = Math.floor(valor/PRECIO_PAGA/COLATERAL);
  $('paga').textContent = paga.toLocaleString('es-ES') + ' PAGA';
  $('valor').textContent = 'Tus DOGE valen $' + usd(valor) + ' · recibes $' + usd(paga*PRECIO_PAGA) + ' en PAGA';
}
async function cargarPrecio(){
  $('precio').textContent = 'Cargando el precio del DOGE…';
  try{
    const r = await fetch('https://api.coingecko.com/api/v3/simple/price?ids=dogecoin&vs_currencies=usd&include_last_updated_at=true',{cache:'no-store'});
    const j = await r.json();
    precio = j.dogecoin.usd;
    const t = new Date(j.dogecoin.last_updated_at*1000);
    $('precio').textContent = 'Precio del DOGE: $' + precio.toLocaleString('es-ES',{maximumFractionDigits:6}) + ' · ' + t.toLocaleString('es-ES');
  }catch(e){
    try{
      const r = await fetch('https://api.binance.com/api/v3/ticker/price?symbol=DOGEUSDT',{cache:'no-store'});
      const j = await r.json(); precio = parseFloat(j.price);
      $('precio').textContent = 'Precio del DOGE: $' + precio.toLocaleString('es-ES',{maximumFractionDigits:6}) + ' · ' + new Date().toLocaleString('es-ES');
    }catch(e2){ precio = 0; $('precio').textContent = 'No se pudo cargar el precio. Prueba de nuevo.'; }
  }
  calcular();
}
$('doge').addEventListener('input', calcular);
$('act').addEventListener('click', cargarPrecio);
function version(v){COLATERAL = v===2 ? 1 : 2.5; $('regla').textContent = v===2 ? 'Sin colateral: precio del DOGE ÷ 0,10' : 'Con colateral del 250 %';history.replaceState(null,'',v===2?'#v2':location.pathname+location.search);document.body.classList.toggle('v2',v===2);$('b1').classList.toggle('on',v===1);$('b2').classList.toggle('on',v===2);calcular();}
$('b1').addEventListener('click',()=>version(1));
$('b2').addEventListener('click',()=>version(2));
if(location.hash==='#v2')version(2);
calcular();
cargarPrecio();
setInterval(cargarPrecio, 5*60*1000);
</script>
<p style="position:fixed;bottom:8px;left:0;right:0;text-align:center;font-size:11px;color:#7F8AA3;margin:0">Referencia orientativa. La cantidad final la fija el contrato con el precio del oráculo al pagar.</p>
</body>
